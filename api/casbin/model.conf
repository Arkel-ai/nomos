# RBAC with domains/tenants.
#
#   sub = the acting user (AuthUser.ID from Better Auth)
#   dom = the domain / tenant the action happens in (e.g. an org id,
#         or the literal "*" for a global domain in the starter)
#   obj = the resource being accessed (e.g. "admin", "items")
#   act = the action (e.g. "read", "write")
#
# Roles are scoped per-domain via g, so a user can be admin in one
# domain and a plain member in another.

[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub, r.dom) && r.dom == p.dom && r.obj == p.obj && r.act == p.act
